

# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:journaling_materials_hub}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:journaling_user}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# 生产环境日志级别
logging:
  level:
    root: WARN
    com.journaling.hub: INFO
    org.springframework.web: WARN

# 生产环境关闭 API 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产环境 Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
