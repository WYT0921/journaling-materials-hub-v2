server:
  port: 8080
  servlet:
    context-path: /

app:
  download:
    free-limit: ${FREE_DOWNLOAD_LIMIT:50}

spring:
  config:
    import:
      - optional:file:.env.example[.properties]
      - optional:file:../.env.example[.properties]
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: journaling-materials-hub
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:journaling_materials_hub}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:600000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:300000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
  flyway:
    enabled: true
    locations: classpath:db
    baseline-on-migrate: true
    baseline-version: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      # 禁用 Redis 连接测试（Redis 不可用时不影响启动）
      timeout: 5000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRES_IN:604800000}  # 7天 (毫秒)
  admin-expiration: ${ADMIN_TOKEN_EXPIRATION:86400000}  # 管理员 token 24小时 (毫秒)

# 管理员配置
admin:
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}  # BCrypt 哈希，通过 BCrypt.hashpw() 生成

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  official:
    app-id: ${WECHAT_OFFICIAL_APP_ID:}
    app-secret: ${WECHAT_OFFICIAL_APP_SECRET:}
    token: ${WECHAT_OFFICIAL_TOKEN:}
    callback-path: /api/wechat/official/callback
    message-mode: plaintext
    probe-api-enabled: ${WECHAT_OFFICIAL_PROBE_API_ENABLED:false}
    max-file-size: ${WECHAT_PROBE_MAX_FILE_SIZE:10485760}
    connect-timeout-millis: ${WECHAT_PROBE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-millis: ${WECHAT_PROBE_READ_TIMEOUT_MS:15000}
    max-redirects: ${WECHAT_PROBE_MAX_REDIRECTS:3}
    executor-core-pool-size: ${WECHAT_PROBE_EXECUTOR_CORE_SIZE:2}
    executor-max-pool-size: ${WECHAT_PROBE_EXECUTOR_MAX_SIZE:4}
    executor-queue-capacity: ${WECHAT_PROBE_EXECUTOR_QUEUE_CAPACITY:100}

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:materials}

# 日志配置
logging:
  level:
    root: INFO
    com.journaling.hub: DEBUG
    com.journaling.hub.mapper: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc API 文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
