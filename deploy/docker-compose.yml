services:
  # SpringBoot 后端
  backend:
    image: journaling-materials-hub-backend:20260821-material-categories
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journaling-materials-hub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-journaling_materials_hub}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=604800000
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_SECRET=${WECHAT_SECRET}
      - WECHAT_OFFICIAL_APP_ID=${WECHAT_OFFICIAL_APP_ID:-}
      - WECHAT_OFFICIAL_APP_SECRET=${WECHAT_OFFICIAL_APP_SECRET:-}
      - WECHAT_OFFICIAL_TOKEN=${WECHAT_OFFICIAL_TOKEN:-}
      - WECHAT_OFFICIAL_PROBE_API_ENABLED=${WECHAT_OFFICIAL_PROBE_API_ENABLED:-false}
      - WECHAT_PROBE_MAX_FILE_SIZE=${WECHAT_PROBE_MAX_FILE_SIZE:-10485760}
      - WECHAT_PROBE_CONNECT_TIMEOUT_MS=${WECHAT_PROBE_CONNECT_TIMEOUT_MS:-5000}
      - WECHAT_PROBE_READ_TIMEOUT_MS=${WECHAT_PROBE_READ_TIMEOUT_MS:-15000}
      - WECHAT_PROBE_MAX_REDIRECTS=${WECHAT_PROBE_MAX_REDIRECTS:-3}
      - WECHAT_PROBE_EXECUTOR_CORE_SIZE=${WECHAT_PROBE_EXECUTOR_CORE_SIZE:-2}
      - WECHAT_PROBE_EXECUTOR_MAX_SIZE=${WECHAT_PROBE_EXECUTOR_MAX_SIZE:-4}
      - WECHAT_PROBE_EXECUTOR_QUEUE_CAPACITY=${WECHAT_PROBE_EXECUTOR_QUEUE_CAPACITY:-100}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=materials
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - ADMIN_TOKEN_EXPIRATION=${ADMIN_TOKEN_EXPIRATION:-86400000}
      - FREE_DOWNLOAD_LIMIT=${FREE_DOWNLOAD_LIMIT:-50}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-https://shouzhangku.store,https://www.shouzhangku.store}
    networks:
      - journaling-network

  # Nginx 反向代理 + 管理端静态文件
  nginx:
    image: nginx:alpine
    container_name: journaling-materials-hub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./admin-frontend/dist:/usr/share/nginx/html/admin
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - journaling-network

networks:
  journaling-network:
    driver: bridge
