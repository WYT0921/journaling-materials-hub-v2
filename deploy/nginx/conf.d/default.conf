# HTTP server: keep ACME challenge available, redirect normal traffic to HTTPS.
server {
    listen 80;
    server_name shouzhangku.store www.shouzhangku.store;

    root /usr/share/nginx/html/admin;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/admin;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name shouzhangku.store www.shouzhangku.store;

    ssl_certificate /etc/nginx/ssl/letsencrypt/live/shouzhangku.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/letsencrypt/live/shouzhangku.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/journaling-materials-hub-ssl-access.log;
    error_log /var/log/nginx/journaling-materials-hub-ssl-error.log;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location ^~ /files/ {
        proxy_pass http://host.docker.internal:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
