<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人中心</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    padding:20px;
}

.phone{
    width:390px;
    min-height:844px;
    background:linear-gradient(
        180deg,
        #f8faf8 0%,
        #f6faf4 100%
    );
    border-radius:40px;
    overflow:hidden;
    position:relative;
}

.content{
    padding:24px 20px 120px;
}

.breadcrumb{
    font-size:12px;
    color:#888;
    margin-bottom:8px;
}

.title{
    font-size:36px;
    font-weight:700;
    margin-bottom:24px;
}

.profile{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
}

.avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    background:#f2f2f2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#bbb;
    font-size:28px;
}

.user-name{
    font-size:20px;
    font-weight:700;
}

.user-level{
    font-size:13px;
    color:#888;
    margin-top:4px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:20px;
}

.stat{
    text-align:center;
    padding:20px 10px;
    border-right:1px solid #eee;
}

.stat:last-child{
    border:none;
}

.stat i{
    color:#aaa;
    margin-bottom:8px;
}

.stat-number{
    font-size:32px;
    font-weight:700;
}

.stat-label{
    color:#888;
    font-size:13px;
}

.vip-card{
    background:#111;
    color:#fff;
    border-radius:16px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.vip-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.vip-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#2c2c2c;
    display:flex;
    align-items:center;
    justify-content:center;
}

.vip-title{
    font-size:20px;
    font-weight:700;
}

.vip-desc{
    font-size:13px;
    color:#ccc;
}

.exchange{
    background:#fff;
    border-radius:16px;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.exchange-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.exchange-title{
    font-weight:600;
}

.exchange-desc{
    font-size:12px;
    color:#999;
}

.menu{
    background:transparent;
    border-top:1px solid #eee;
    padding-top:12px;
}

.menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
}

.menu-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.menu-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#888;
}

.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:84px;
    background:#fff;
    border-top:1px solid #eee;
    display:flex;
}

.nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:12px;
}

.nav-item.active{
    color:#111;
    font-weight:600;
}

.nav-item i{
    font-size:20px;
    margin-bottom:4px;
}

</style>
</head>
<body>

<div class="phone">

<div class="content">

<div class="breadcrumb">
我的 · Account
</div>

<div class="title">
个人中心
</div>

<div class="profile">
<div class="avatar">
<i class="fa-regular fa-user"></i>
</div>

<div>
<div class="user-name">
手账控Mori
</div>

<div class="user-level">
普通用户
</div>
</div>
</div>

<div class="stats">

<div class="stat">
<i class="fa-solid fa-download"></i>
<div class="stat-number">47</div>
<div class="stat-label">下载</div>
</div>

<div class="stat">
<i class="fa-regular fa-heart"></i>
<div class="stat-number">23</div>
<div class="stat-label">收藏</div>
</div>

<div class="stat">
<i class="fa-regular fa-image"></i>
<div class="stat-number">128</div>
<div class="stat-label">素材</div>
</div>

</div>

<div class="vip-card">

<div class="vip-left">

<div class="vip-icon">
<i class="fa-regular fa-crown"></i>
</div>

<div>
<div class="vip-title">
会员中心
</div>

<div class="vip-desc">
解锁高清素材 + 全部工具
</div>
</div>

</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

<div class="exchange">

<div class="exchange-left">
<i class="fa-regular fa-ticket"></i>

<div>
<div class="exchange-title">
兑换会员
</div>

<div class="exchange-desc">
使用兑换码激活会员权益
</div>
</div>
</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

<div class="menu">

<div class="menu-item">
<div class="menu-left">
<div class="menu-icon">
<i class="fa-solid fa-gear"></i>
</div>
设置
</div>
<i class="fa-solid fa-chevron-right"></i>
</div>

<div class="menu-item">
<div class="menu-left">
<div class="menu-icon">
<i class="fa-regular fa-folder"></i>
</div>
素材管理
</div>
<i class="fa-solid fa-chevron-right"></i>
</div>

<div class="menu-item">
<div class="menu-left">
<div class="menu-icon">
<i class="fa-solid fa-circle-info"></i>
</div>
关于
</div>
<i class="fa-solid fa-chevron-right"></i>
</div>

<div class="menu-item">
<div class="menu-left">
<div class="menu-icon">
<i class="fa-regular fa-message"></i>
</div>
反馈建议
</div>
<i class="fa-solid fa-chevron-right"></i>
</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav-item">
<i class="fa-solid fa-house"></i>
首页
</div>

<div class="nav-item">
<i class="fa-solid fa-grip"></i>
工具
</div>

<div class="nav-item active">
<i class="fa-solid fa-user"></i>
我的
</div>

</div>

</div>

</body>
</html>
